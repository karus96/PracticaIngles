<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="css/style.css">
  <title>Elige tu práctica</title>
</head>
<body>
  <h1>¿Qué quieres practicar?</h1>
  <div class="options">
    <button class="btn" onclick="startGame('pastSimple')">Pasado simple</button>
    <button class="btn" onclick="startGame('pastParticiple')">Pasado participio</button>
    <button class="btn" onclick="startGame('phrasalVerbs')">Frases adverbiales</button>
  </div>

  <script>
    function startGame(category) {
      window.location.href = `game.html?category=${encodeURIComponent(category)}`;
    }
  </script>
</body>
</html>
