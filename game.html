<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Juego de Pareo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1 id="game-title">Empareja los conceptos</h1>

 <h2 id="instructions" style="text-align: center; margin-bottom: 15px; color: #34495e;">
  Selecciona un elemento de cada columna para emparejarlos
</h2>

<table id="gameTable" style="width: 90%; max-width: 600px; margin: 0 auto; border-collapse: collapse;">
  <thead>
    <tr>
      <th id="colA-title" style="padding: 12px; background: #3498db; color: white; text-align: center; border: 1px solid #2980b9;"></th>
      <th id="colB-title" style="padding: 12px; background: #3498db; color: white; text-align: center; border: 1px solid #2980b9;"></th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <!-- Las filas se generarán aquí con JS -->
  </tbody>
</table>
  
<div id="message"></div>
<div id="summaryTable"></div> <!-- ← debe estar aquí -->
<div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
  <button id="restartBtn" class="btn">🔄 Reiniciar juego</button>
  <button id="backBtn" class="btn">← Volver al menú</button>
</div>

  <!-- Carga en orden correcto -->
  <script src="js/data.js"></script>
  <script src="js/functions.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
